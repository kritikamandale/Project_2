name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  # ==========================================================================
  # Backend — Pytest
  # ==========================================================================
  test-backend:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: skin_analysis_test
          POSTGRES_USER: skin_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get install -y libmagic1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations on test DB
        env:
          DATABASE_URL: postgresql+asyncpg://skin_user:test_password@localhost:5432/skin_analysis_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          SECRET_KEY: ci-test-secret-key-not-real-000000
          JWT_SECRET_KEY: ci-test-jwt-secret-not-real-000000
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_REGION: ap-south-1
          S3_BUCKET_NAME: test-bucket
          ANTHROPIC_API_KEY: sk-ant-test-key
          PINECONE_API_KEY: test-pinecone-key
          PINECONE_ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run Pytest with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://skin_user:test_password@localhost:5432/skin_analysis_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          SECRET_KEY: ci-test-secret-key-not-real-000000
          JWT_SECRET_KEY: ci-test-jwt-secret-not-real-000000
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_REGION: ap-south-1
          S3_BUCKET_NAME: test-bucket
          ANTHROPIC_API_KEY: sk-ant-test-key
          PINECONE_API_KEY: test-pinecone-key
          PINECONE_ENVIRONMENT: test
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: apps/api/coverage.xml
          flags: backend
        continue-on-error: true  # Don't fail CI if Codecov is down

  # ==========================================================================
  # Backend — Lint (Ruff)
  # ==========================================================================
  lint-backend:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff==0.8.0

      - name: Run Ruff
        run: ruff check app/

  # ==========================================================================
  # Backend — Security linting (Bandit)
  # ==========================================================================
  security-scan-backend:
    name: Backend Security Scan (Bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install bandit==1.7.10

      - name: Run Bandit (fail on HIGH severity)
        run: |
          bandit -r app/ \
            --severity-level high \
            --exclude app/tests \
            -f txt

  # ==========================================================================
  # Frontend — Vitest unit tests
  # ==========================================================================
  test-frontend:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test:coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          file: apps/web/coverage/lcov.info
          flags: frontend
        continue-on-error: true

  # ==========================================================================
  # Frontend — Lint (ESLint) + type-check (tsc)
  # ==========================================================================
  lint-frontend:
    name: Frontend Lint & Type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type-check
        run: pnpm type-check

  # ==========================================================================
  # Frontend — npm audit (fail on critical)
  # ==========================================================================
  security-scan-frontend:
    name: Frontend Security Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit (fail on critical)
        run: pnpm audit --audit-level=critical

  # ==========================================================================
  # Secret scanning (gitleaks)
  # ==========================================================================
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Playwright E2E (runs against preview deployment if available)
  # ==========================================================================
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, lint-backend, lint-frontend]
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PREVIEW_URL || 'http://localhost:3000' }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: pnpm exec playwright test tests/e2e/ --reporter=github

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
