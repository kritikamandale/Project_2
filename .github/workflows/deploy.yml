name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip Alembic migrations"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy

jobs:

  # ==========================================================================
  # Run Alembic migrations
  # ==========================================================================
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_migrations != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Alembic + driver
        run: pip install alembic asyncpg sqlalchemy sqlalchemy[asyncio]

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        working-directory: apps/api
        run: alembic upgrade head

  # ==========================================================================
  # Deploy FastAPI to Railway
  # ==========================================================================
  deploy-backend:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    needs: migrate
    # Deploy even when migrations are skipped; only block on migration failure
    if: ${{ always() && needs.migrate.result != 'failure' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service skinanalysis-api \
            --detach \
            --environment production

  # ==========================================================================
  # Deploy Next.js to Vercel
  # ==========================================================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ==========================================================================
  # Slack notification
  # ==========================================================================
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' && '✅' || '❌' }} *Skinest Deploy* — ${{ github.ref_name }} (`${{ github.sha }}` by ${{ github.actor }})\n*API:* ${{ needs.deploy-backend.result }} | *Web:* ${{ needs.deploy-frontend.result }}"
            }
