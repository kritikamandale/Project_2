name: Deploy to Production

on:
  # Deploy only after the CI workflow has finished running on main — this is
  # the staging gate: a red CI run (tests/lint/security scan) never reaches
  # production. workflow_run fires independently of the push event, so this
  # can't race the CI workflow that triggered it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip Alembic migrations"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel a running deploy

jobs:

  # ==========================================================================
  # Gate — only proceed if CI succeeded (or this was manually dispatched)
  # ==========================================================================
  gate:
    name: Require CI success
    runs-on: ubuntu-latest
    # Manual dispatch is only honoured from main — without this, anyone with
    # workflow-run permission could deploy an arbitrary branch straight to
    # production. (GitHub Environment protection rules on `production`, set
    # separately in repo settings, are the second layer restricting *who*.)
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "CI passed on main (or manual dispatch from main) — proceeding to deploy."

  # ==========================================================================
  # Run Alembic migrations
  # ==========================================================================
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ github.event.inputs.skip_migrations != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Alembic + driver
        run: pip install alembic asyncpg sqlalchemy sqlalchemy[asyncio]

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        working-directory: apps/api
        run: alembic upgrade head

  # ==========================================================================
  # Deploy FastAPI to Railway
  # ==========================================================================
  deploy-backend:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    needs: [gate, migrate]
    # Deploy even when migrations are skipped; only block on gate/migration failure
    if: ${{ always() && needs.gate.result == 'success' && needs.migrate.result != 'failure' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service skinanalysis-api \
            --detach \
            --environment production

  # ==========================================================================
  # Deploy Next.js to Vercel
  # Runs only after the backend deploy succeeds, so the frontend never ships
  # pointing at API routes/migrations that aren't live yet.
  # ==========================================================================
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ needs.deploy-backend.result == 'success' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ==========================================================================
  # Post-deploy smoke test — verifies both services actually came up healthy
  # before declaring the deploy a success. Failure here surfaces in Slack so
  # a bad deploy gets noticed immediately instead of silently serving errors.
  # ==========================================================================
  smoke-test:
    name: Post-deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: ${{ needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' }}

    steps:
      - name: Wait for API health check
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ secrets.PRODUCTION_API_URL }}/health"; then
              echo "API is healthy."
              exit 0
            fi
            echo "API not ready yet (attempt $i/10), retrying in 10s..."
            sleep 10
          done
          echo "API failed health check after deploy." >&2
          exit 1

      - name: Check frontend responds
        run: curl -fsS -o /dev/null "${{ secrets.PRODUCTION_WEB_URL }}"

  # ==========================================================================
  # Slack notification
  # ==========================================================================
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend, smoke-test]
    if: always()

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' && needs.smoke-test.result == 'success' && '✅' || '❌' }} *Skinest Deploy* — ${{ github.ref_name }} (`${{ github.sha }}` by ${{ github.actor }})\n*API:* ${{ needs.deploy-backend.result }} | *Web:* ${{ needs.deploy-frontend.result }} | *Smoke test:* ${{ needs.smoke-test.result }}"
            }
