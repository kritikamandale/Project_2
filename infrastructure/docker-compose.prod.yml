version: "3.9"

# =============================================================================
# AI SKIN ANALYSIS PLATFORM — PRODUCTION DOCKER COMPOSE
# Usage: docker compose -f docker-compose.prod.yml up -d
# =============================================================================
# All secrets are injected via env_file or environment — never hard-coded.
# Services are networked: internal (db, cache, api) vs external (nginx only).
# =============================================================================

networks:
  internal:
    driver: bridge
    internal: true      # No direct internet access for backend services
  external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_certs:
  clamav_db:

services:

  # ===========================================================================
  # PostgreSQL 15 — primary database
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    networks: [internal]
    # Blocks privilege escalation (setuid binaries etc.) without touching the
    # image's own entrypoint, which needs to run as root briefly to fix volume
    # ownership before it drops privileges to its own `postgres` user — an
    # explicit `user:` override here would break that and fail to start.
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      # Tuning for production (4 CPU, 4GB RAM instance)
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c maintenance_work_mem=128MB
        -c wal_level=replica
        -c ssl=on
        -c log_connections=on
        -c log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 512m

  # PostgreSQL daily backup — dumps to S3 via pg_dump + aws s3 cp
  postgres-backup:
    image: postgres:15-alpine
    restart: "no"
    networks: [internal]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-skinanalysis-backups}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    entrypoint: >
      sh -c "
        FILENAME=skinanalysis_$$(date +%Y%m%d_%H%M%S).pgdump &&
        pg_dump -h $$POSTGRES_HOST -U $$POSTGRES_USER -Fc $$POSTGRES_DB > /tmp/$$FILENAME &&
        aws s3 cp /tmp/$$FILENAME s3://$$S3_BACKUP_BUCKET/$$FILENAME &&
        echo 'Backup uploaded: '$$FILENAME
      "
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [backup]   # Triggered by: docker compose --profile backup run postgres-backup

  # ===========================================================================
  # Redis 7 — session cache, rate limiting, JTI blacklist
  # ===========================================================================
  redis:
    image: redis:7-alpine
    restart: always
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?required}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

  # ===========================================================================
  # ClamAV — malware scanning sidecar
  # ===========================================================================
  clamav:
    image: clamav/clamav:stable
    restart: always
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    volumes:
      - clamav_db:/var/lib/clamav
    environment:
      CLAMAV_NO_CLAMD: "false"
      CLAMAV_NO_FRESHCLAMD: "false"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s    # ClamAV takes ~2min to initialise + update sigs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  # ===========================================================================
  # FastAPI — backend API (Gunicorn + Uvicorn workers)
  # ===========================================================================
  fastapi:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: production
    restart: always
    networks: [internal]
    env_file:
      - ../.env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_ENABLED: "true"
    command: >
      gunicorn app.main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers 4
        --bind 0.0.0.0:8000
        --timeout 120
        --keep-alive 5
        --access-logfile -
        --error-logfile -
        --log-level warning
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          memory: 512m

  # ===========================================================================
  # Next.js — frontend (standalone output)
  # ===========================================================================
  nextjs:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: production
    restart: always
    networks: [internal, external]
    env_file:
      - ../.env.local.production
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""    # Proxied via Nginx — internal traffic
    command: node server.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  # ===========================================================================
  # Nginx — SSL termination, rate limiting, reverse proxy
  # ===========================================================================
  nginx:
    image: nginx:1.27-alpine
    restart: always
    networks: [internal, external]
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      fastapi:
        condition: service_healthy
      nextjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
