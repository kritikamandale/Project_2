worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ---------------------------------------------------------------------------
    # Globals
    # ---------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from error pages and headers
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;
    gzip_vary on;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_general:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m     rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_scan:10m     rate=5r/m;
    limit_req_zone $binary_remote_addr zone=static:10m       rate=300r/m;
    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # Connection limits
    # ---------------------------------------------------------------------------
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream fastapi {
        server fastapi:8000;
        keepalive 32;
    }

    upstream nextjs {
        server nextjs:3000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------------
    # Main HTTPS server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name yourdomain.com www.yourdomain.com;

        # ---- TLS ----
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ---- Security headers (added by Nginx; app may also set some) ----
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Permitted-Cross-Domain-Policies none always;

        # ---- Upload size ----
        client_max_body_size 5m;

        # ---- Connection limit per IP ----
        limit_conn per_ip 20;

        # ====================================================================
        # FastAPI — auth endpoints (strict rate limit)
        # ====================================================================
        location ~ ^/api/v1/auth/(login|register|forgot-password) {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass         http://fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # FastAPI — scan endpoint (per-user limit enforced in app)
        location /api/v1/scan {
            limit_req zone=api_scan burst=3 nodelay;
            proxy_pass         http://fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # FastAPI — all other API routes
        location /api/v1/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass         http://fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ====================================================================
        # Next.js static assets — long cache, no rate limit
        # ====================================================================
        location /_next/static/ {
            proxy_pass       http://nextjs;
            expires          1y;
            add_header       Cache-Control "public, immutable";
            limit_req        zone=static burst=100 nodelay;
        }

        # Next.js public files
        location /public/ {
            proxy_pass       http://nextjs;
            expires          7d;
            add_header       Cache-Control "public";
        }

        # ====================================================================
        # Next.js — all other routes (SSR)
        # ====================================================================
        location / {
            proxy_pass         http://nextjs;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ====================================================================
        # Block common attack paths
        # ====================================================================
        location ~* \.(php|asp|aspx|jsp|cgi|env|git|svn)$ {
            return 404;
        }

        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
